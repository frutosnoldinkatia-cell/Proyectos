# Corre la suite del backend (incluidos los tests de integración con PostgreSQL)
# en cada push a main o dev-agentes y en cada pull request.
name: Tests

on:
  push:
    branches: [main, dev-agentes]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rastreo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rastreo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/rastreo_test
          DATABASE_SSL: "false"
