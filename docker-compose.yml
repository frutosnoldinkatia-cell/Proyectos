# Configuración: copiar backend/.env.example a backend/.env y completar los valores
# (ver INSTRUCCIONES_DOCKER.txt). Sin backend/.env el contenedor web no arranca.
services:
  db:
    image: postgres:16-alpine
    container_name: rastreopy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rastreo_py}
    ports:
      # Solo accesible desde esta computadora, no desde la red local.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rastreo_py}"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rastreopy-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    # Correo, JWT, administrador y APP_URL se leen de backend/.env.
    env_file:
      - path: ./backend/.env
        required: true
    # Lo que va acá pisa a backend/.env: solo lo propio del entorno Docker.
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-rastreo_py}
      DATABASE_SSL: "false"

volumes:
  pgdata:
    driver: local
